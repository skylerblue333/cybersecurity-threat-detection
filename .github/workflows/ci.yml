name: threat-triage-ci

on:
  push:
    branches: [main, "product/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned tooling
        run: npm install --ignore-scripts --no-fund
      - name: Strict build and tests
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high
